  fire:
    needs: w12
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          H=$(date +%H%M); D=$(date +%u)
          if [ "$D" -ge 6 ] || [ "$H" -gt 1330 ]; then echo "outside window"; exit 0; fi
          A=$(gh run list -R "$GITHUB_REPOSITORY" -w intraday.yml -L 5 --json status -q '[.[]|select(.status=="in_progress" or .status=="queued")]|length')
          if [ "$A" -gt 0 ]; then echo "intraday already running"; exit 0; fi
          gh workflow run intraday.yml -R "$GITHUB_REPOSITORY" --ref main
