name: wake
# 每天盤中跑完後由 intraday.yml 觸發：在雲端排隊等到下一個平日 08:46（台北），再啟動 intraday.yml。
# 不依賴 GitHub 定時排程（會漏），每個 job 最多睡約 5.75 小時，12 個 job 可跨週末。
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'epoch seconds to wake (optional)'
        required: false
permissions:
  actions: write
concurrency:
  group: wake
  cancel-in-progress: true
env:
  TZ: Asia/Taipei
jobs:
  w1:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      t: ${{ steps.s.outputs.t }}
    steps:
      - id: s
        run: |
          T="${{ inputs.target }}"
          if [ -z "$T" ]; then
            T=$(date -d "today 08:46" +%s); [ "$(date +%s)" -ge "$T" ] && T=$(date -d "tomorrow 08:46" +%s)
            while [ "$(date -d @$T +%u)" -ge 6 ]; do T=$((T+86400)); done
          fi
          echo "t=$T" >> $GITHUB_OUTPUT
          echo "target $(date -d @$T)"
          R=$(( T - $(date +%s) )); [ $R -gt 20700 ] && R=20700
          if [ $R -gt 0 ]; then sleep $R; fi
  w2:
    needs: w1
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      t: ${{ steps.s.outputs.t }}
    steps:
