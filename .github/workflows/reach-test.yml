name: reach-test
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA='Mozilla/5.0 (intraday-dashboard; personal use; low-rate)'
          for u in "https://query1.finance.yahoo.com/v8/finance/chart/2330.TW?interval=5m&range=1d" \
                   "https://query1.finance.yahoo.com/v8/finance/chart/TWD=X?interval=1m&range=1d" ; do
            echo "=== $u"; curl -sS -m 25 -A "$UA" -o /tmp/o -w 'HTTP %{http_code} size %{size_download}\n' "$u"; head -c 200 /tmp/o; echo; sleep 1
          done
          pip install -q yfinance
          python - <<'PY'
          import yfinance as yf
          df=yf.download("2330.TW 8299.TWO 2317.TW",period="1d",interval="1m",group_by="ticker",progress=False)
          print("yf rows",len(df), df.index[-1] if len(df) else None)
          t=yf.Ticker("TWD=X"); print("twd", len(t.history(period="1d",interval="1m")))
          PY
